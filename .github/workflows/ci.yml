name: CI

# Todos los jobs usan ubuntu-24.04 (la imagen del motor en producción). ubuntu-latest pasó a
# Ubuntu 26.04 y el 2026-11-11 sus repositorios de paquetes no resolvían (apt fallaba antes de las pruebas).
# Esqueleto de CI (issue A1). El cableado real de build para Linux llega en C1
# (CMake headless sin Oboe + libmp3lame/libshout). Por ahora validamos estructura.

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  structure:
    name: Verificar estructura y licencia
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar archivos de licencia y atribución
        run: |
          test -f LICENSE
          test -f NOTICE
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          echo "LICENSE y NOTICE presentes."
      - name: Comprobar que Oboe no está vendorizado (build de servidor)
        run: |
          if [ -d third_party/oboe ]; then
            echo "ERROR: third_party/oboe no debe estar en el build de servidor"; exit 1
          fi
          echo "OK: sin Oboe."
      - name: Comprobar motor forkeado presente
        run: |
          test -f engine/dj_engine.cpp
          test -f engine/dj_engine.h
          echo "Motor presente."

  build:
    name: Build headless del motor (Linux) + selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libmp3lame-dev libshout3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libcurl4-openssl-dev libmicrohttpd-dev
      - name: Configurar y compilar (sin Oboe)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j"$(nproc)"
      - name: Autoprueba headless (arranque del motor + OfflineSink)
        run: ./build/engine_selftest
      - name: Prueba del selector inteligente (armonía/tempo/energía)
        run: ./build/selector_test
      - name: Prueba de seguridad del Control API (auth Bearer, rate limit, CORS)
        run: ./build/control_api_test
      - name: Prueba de reproducción continua + recuperación ante fallos (A1.4)
        run: ./build/playback_recovery_test
      - name: Punto de mezcla por energía y regreso al tempo (funciones del AutoMix)
        run: ./build/mix_points_test
      - name: Mezclador de voz (micrófonos + talkover)
        run: ./build/voice_test
      - name: Efectos de audio (eco, delay, reverb, filtro, flanger, phaser, bitcrush)
        run: ./build/fx_test

  wasm:
    name: Build WASM del motor (emscripten) + autoprueba de enlace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Emscripten 6.0.13
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: Compilar el WASM completo (audit_engine + audit_selftest)
        run: |
          emcmake cmake -S wasm -B wasm/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build wasm/build -j"$(nproc)"
      - name: Comprobar artefactos del motor
        run: |
          test -f wasm/build/audit_engine.js
          test -f wasm/build/audit_engine.wasm
          test -f wasm/build/audit_selftest.html
          echo "WASM OK: audit_engine.{js,wasm} + audit_selftest.html"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: EQ del motor profesional (WASM) desde la consola v0.6 — el agudo no se pierde (H-01)
        run: node web/pro/v06/tests/eq_motor_profesional_e2e.mjs wasm/build

  frontend:
    name: Pruebas del frontend (buscador + proxy de música)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pruebas del login de la consola (demo opt-in, prefijo /api/v1, permiso por app)
        run: node web/pro/commandcenter_test.mjs
      - name: Pruebas del cambio de clave propio del cliente (/apps/auth/change-password)
        run: node web/pro/commandcenter_changepw_test.mjs
      - name: Pruebas unitarias del buscador unificado (licencias, dedup, cancelación)
        run: node web/pro/search_test.mjs
      - name: Prueba de integración del proxy de música (Jamendo/Archive, upstream simulado)
        run: node deploy/pro/proxy_test.mjs
      - name: Prueba del proxy del agente DJ (HTTP + WebSocket, agente simulado)
        run: node deploy/pro/agent_proxy_test.mjs
      - name: config.js publica la URL del stream para los reproductores
        run: node deploy/pro/stream_url_test.mjs
      - name: Prueba del Generador de sets por IA (intérprete + orden, Fase 3C)
        run: node web/pro/setai_test.mjs

  video:
    name: Consola v0.6 en Chromium real (video y sesión AUDIT-IA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Mezcla por GPU y respaldo 2D, transiciones, efectos, texto, logo y biblioteca persistente
        run: node web/pro/v06/tests/video_v1_e2e.mjs
      - name: Pantalla 2 (proyector), transiciones al enviar a programa y botón de pánico
        run: node web/pro/v06/tests/video_v2_pantalla2_e2e.mjs
      - name: Fotos, presentaciones (PDF), videoclips con sonido y cues de eventos
        run: node web/pro/v06/tests/video_v3_e2e.mjs
      - name: «Escuchar en vivo» reproduce el stream del servidor (COEP + CORP)
        run: node web/pro/v06/tests/escuchar_stream_e2e.mjs
      - name: Forma de onda real en los decks (cabezal, clic para ir a un punto)
        run: node web/pro/v06/tests/onda_real_e2e.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias del agente DJ (las mismas versiones de services/dj-agent/pyproject.toml)
        run: |
          python -c "import tomllib; d = tomllib.load(open('services/dj-agent/pyproject.toml', 'rb')); print('\n'.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))" > "$RUNNER_TEMP/agente-req.txt"
          pip install -r "$RUNNER_TEMP/agente-req.txt"
      - name: Inicio de sesión real del Command Center en la v0.6 (Command Center simulado)
        run: PYTHON=python node web/pro/v06/tests/sesion_real_e2e.mjs
      - name: Agente DJ en vivo en la consola (modos, órdenes, aprobaciones, historial; motor simulado)
        run: PYTHON=python node web/pro/v06/tests/agent_live_e2e.mjs
      - name: Login con el Command Center y conexión automática del agente (Command Center simulado)
        run: PYTHON=python node web/pro/v06/tests/cc_login_e2e.mjs
      - name: Dictado por voz y uso en el móvil (voz simulada, emulación de teléfono)
        run: PYTHON=python node web/pro/v06/tests/voice_mobile_e2e.mjs

  agente:
    name: Agente DJ (ruff + pytest con el motor real)
    # Igual que microfonos-e2e: la imagen del motor en producción es ubuntu:24.04 (libshout/Icecast).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain del motor y ffmpeg
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ pkg-config libmp3lame-dev libshout3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libcurl4-openssl-dev libmicrohttpd-dev ffmpeg
      - name: Compilar el servidor del motor
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j"$(nproc)" --target audit_sound_server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias del agente (las mismas versiones de services/dj-agent/pyproject.toml, con las de desarrollo)
        run: |
          python -c "import tomllib; d = tomllib.load(open('services/dj-agent/pyproject.toml', 'rb')); print('\n'.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))" > "$RUNNER_TEMP/agente-req.txt"
          cat "$RUNNER_TEMP/agente-req.txt"
          pip install -r "$RUNNER_TEMP/agente-req.txt"
      - name: Estilo y errores estáticos (ruff)
        working-directory: services/dj-agent
        run: ruff check .
      - name: Pruebas del agente (unitarias, integración, contrato, failover y con el binario real del motor)
        working-directory: services/dj-agent
        env:
          DJ_AGENT_REAL_ENGINE_BIN: ${{ github.workspace }}/build/audit_sound_server
        run: |
          set -o pipefail
          python -m pytest -rs 2>&1 | tee "$RUNNER_TEMP/pytest.txt"
          # Ninguna prueba puede quedar omitida: si faltara el binario o ffmpeg, las del motor
          # real se saltarían en silencio y la CI quedaría verde sin probarlas.
          if grep -Eq "[0-9]+ skipped" "$RUNNER_TEMP/pytest.txt"; then
            echo "ERROR: hay pruebas omitidas (ver el resumen de arriba)."; exit 1
          fi

  microfonos-e2e:
    name: Micrófonos y efectos en vivo (consola → agente → motor → Icecast, servicios reales)
    # Igual que la imagen del motor en producción (deploy/engine/Dockerfile: ubuntu:24.04). En
    # ubuntu-latest (más nuevo) libshout e Icecast no se entienden (Icecast rechaza «!POKE» y se cae el montaje).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain del motor, Icecast y ffmpeg
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ pkg-config libmp3lame-dev libshout3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libcurl4-openssl-dev libmicrohttpd-dev icecast2 ffmpeg gdb
      - name: Compilar el servidor del motor
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j"$(nproc)" --target audit_sound_server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright, Chromium y dependencias del agente
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          python -c "import tomllib; d = tomllib.load(open('services/dj-agent/pyproject.toml', 'rb')); print('\n'.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))" > "$RUNNER_TEMP/agente-req.txt"
          pip install -r "$RUNNER_TEMP/agente-req.txt"
      - name: Voz al stream con talkover, verificada por un oyente
        run: GDB=1 PYTHON=python node web/pro/v06/tests/microfono_stream_e2e.mjs
      - name: Efectos de audio desde la consola, verificados por un oyente
        run: GDB=1 PYTHON=python node web/pro/v06/tests/efectos_stream_e2e.mjs
      - name: Icecast se cae y vuelve 10 veces sin tumbar el motor (H-23, SIGPIPE) y el stream se reconecta (S1)
        run: |
          # Antes del arreglo, ~1 de cada 3 caídas de Icecast mataba el motor con SIGPIPE (código 141).
          for i in $(seq 1 10); do
            echo "== Repetición $i/10"
            bash scripts/verificar_s1_reconexion.sh 2>&1 | tee "$RUNNER_TEMP/s1.txt"
            # El script se salta (código 0) si falta icecast o ffprobe; en la CI eso es un fallo.
            grep -q "RESULTADO S1: 3 OK, 0 FAIL" "$RUNNER_TEMP/s1.txt" || { echo "ERROR en la repetición $i"; exit 1; }
          done
