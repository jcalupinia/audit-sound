name: CI

# Esqueleto de CI (issue A1). El cableado real de build para Linux llega en C1
# (CMake headless sin Oboe + libmp3lame/libshout). Por ahora validamos estructura.

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

jobs:
  structure:
    name: Verificar estructura y licencia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar archivos de licencia y atribución
        run: |
          test -f LICENSE
          test -f NOTICE
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          echo "LICENSE y NOTICE presentes."
      - name: Comprobar que Oboe no está vendorizado (build de servidor)
        run: |
          if [ -d third_party/oboe ]; then
            echo "ERROR: third_party/oboe no debe estar en el build de servidor"; exit 1
          fi
          echo "OK: sin Oboe."
      - name: Comprobar motor forkeado presente
        run: |
          test -f engine/dj_engine.cpp
          test -f engine/dj_engine.h
          echo "Motor presente."

  build:
    name: Build headless del motor (Linux) + selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libmp3lame-dev libshout3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libcurl4-openssl-dev libmicrohttpd-dev
      - name: Configurar y compilar (sin Oboe)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j"$(nproc)"
      - name: Autoprueba headless (arranque del motor + OfflineSink)
        run: ./build/engine_selftest
      - name: Prueba del selector inteligente (armonía/tempo/energía)
        run: ./build/selector_test
      - name: Prueba de seguridad del Control API (auth Bearer, rate limit, CORS)
        run: ./build/control_api_test
      - name: Prueba de reproducción continua + recuperación ante fallos (A1.4)
        run: ./build/playback_recovery_test
      - name: Punto de mezcla por energía y regreso al tempo (funciones del AutoMix)
        run: ./build/mix_points_test
      - name: Mezclador de voz (micrófonos + talkover)
        run: ./build/voice_test

  wasm:
    name: Build WASM del motor (emscripten) + autoprueba de enlace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Emscripten 6.0.13
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: Compilar el WASM completo (audit_engine + audit_selftest)
        run: |
          emcmake cmake -S wasm -B wasm/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build wasm/build -j"$(nproc)"
      - name: Comprobar artefactos del motor
        run: |
          test -f wasm/build/audit_engine.js
          test -f wasm/build/audit_engine.wasm
          test -f wasm/build/audit_selftest.html
          echo "WASM OK: audit_engine.{js,wasm} + audit_selftest.html"

  frontend:
    name: Pruebas del frontend (buscador + proxy de música)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pruebas del login de la consola (demo opt-in, prefijo /api/v1, permiso por app)
        run: node web/pro/commandcenter_test.mjs
      - name: Pruebas del cambio de clave propio del cliente (/apps/auth/change-password)
        run: node web/pro/commandcenter_changepw_test.mjs
      - name: Pruebas unitarias del buscador unificado (licencias, dedup, cancelación)
        run: node web/pro/search_test.mjs
      - name: Prueba de integración del proxy de música (Jamendo/Archive, upstream simulado)
        run: node deploy/pro/proxy_test.mjs
      - name: Prueba del proxy del agente DJ (HTTP + WebSocket, agente simulado)
        run: node deploy/pro/agent_proxy_test.mjs
      - name: Prueba del Generador de sets por IA (intérprete + orden, Fase 3C)
        run: node web/pro/setai_test.mjs

  video:
    name: Consola v0.6 en Chromium real (video y sesión AUDIT-IA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Mezcla por GPU y respaldo 2D, transiciones, efectos, texto, logo y biblioteca persistente
        run: node web/pro/v06/tests/video_v1_e2e.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias del agente DJ
        run: pip install "fastapi==0.162.2" "pydantic==2.10.4" "uvicorn==0.34.0" "httpx==0.28.1" "websockets==14.1"
      - name: Inicio de sesión real del Command Center en la v0.6 (Command Center simulado)
        run: PYTHON=python node web/pro/v06/tests/sesion_real_e2e.mjs

  microfonos-e2e:
    name: Micrófonos en vivo (consola → agente → motor → Icecast, servicios reales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain del motor, Icecast y ffmpeg
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ pkg-config libmp3lame-dev libshout3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libcurl4-openssl-dev libmicrohttpd-dev icecast2 ffmpeg gdb
      - name: Compilar el servidor del motor
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j"$(nproc)" --target audit_sound_server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright, Chromium y dependencias del agente
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          pip install "fastapi==0.162.2" "pydantic==2.10.4" "uvicorn==0.34.0" "httpx==0.28.1" "websockets==14.1"
      - name: Voz al stream con talkover, verificada por un oyente
        run: GDB=1 PYTHON=python node web/pro/v06/tests/microfono_stream_e2e.mjs
