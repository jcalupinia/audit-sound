# AUDIT SOUND · Agente DJ — Contrato OpenAPI (Fase 1)
# GENERADO desde el código con services/dj-agent/scripts/export_openapi.py — no editar a mano.
# El WebSocket de eventos (no representable en OpenAPI) está documentado en
# docs/dj-agent/05_ESTADOS_Y_POLITICAS_DEL_AGENTE.md, sección 7.
openapi: 3.1.0
info:
  title: AUDIT SOUND · Agente DJ
  description: 'Agente DJ de AUDIT SOUND (Fase 1). Servicio AISLADO del motor de audio:

    planifica y emite comandos validados; el motor C++ y su AutoMix garantizan la
    continuidad.

    Motor por defecto: SIMULADO. Contratos derivados del código implementado.'
  version: 0.1.0
