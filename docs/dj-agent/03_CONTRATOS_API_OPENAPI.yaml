components:
  schemas:
    AgentState:
      type: string
      enum:
      - AVAILABLE
      - DEGRADED
      - OFFLINE
      title: AgentState
    CommandIn:
      properties:
        action:
          type: string
          maxLength: 40
          minLength: 1
          title: Action
        params:
          type: object
          title: Params
        expected_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Version
      additionalProperties: false
      type: object
      required:
      - action
      title: CommandIn
    CommandOut:
      properties:
        id:
          type: string
          title: Id
        session_id:
          type: string
          title: Session Id
        action:
          type: string
          title: Action
        params:
          type: object
          title: Params
        origin:
          $ref: '#/components/schemas/Origin'
        actor_id:
          type: string
          title: Actor Id
        status:
          $ref: '#/components/schemas/CommandStatus'
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        correlation_id:
          type: string
          title: Correlation Id
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
          default: false
        created_at:
          type: number
          title: Created At
      type: object
      required:
      - id
      - session_id
      - action
      - params
      - origin
      - actor_id
      - status
      - correlation_id
      - created_at
      title: CommandOut
    CommandStatus:
      type: string
      enum:
      - PROPOSED
      - ACCEPTED
      - SENT
      - ACKNOWLEDGED
      - REJECTED
      - FAILED
      title: CommandStatus
    ControlRequest:
      properties:
        action:
          type: string
          enum:
          - take
          - release
          - request
          - approve
          - deny
          - force
          title: Action
        heartbeat:
          type: boolean
          title: Heartbeat
          default: false
      additionalProperties: false
      type: object
      required:
      - action
      title: ControlRequest
    DecisionIn:
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        reason:
          type: string
          maxLength: 300
          title: Reason
          default: ''
      additionalProperties: false
      type: object
      required:
      - decision
      title: DecisionIn
    DecisionResult:
      properties:
        proposal:
          $ref: '#/components/schemas/ProposalOut'
        commands:
          items:
            type: object
          type: array
          title: Commands
      type: object
      required:
      - proposal
      - commands
      title: DecisionResult
    DeckOut:
      properties:
        deck:
          type: integer
          title: Deck
        title:
          type: string
          title: Title
          default: ''
        track_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Track Id
        loaded:
          type: boolean
          title: Loaded
          default: false
        playing:
          type: boolean
          title: Playing
          default: false
        pos:
          type: number
          title: Pos
          default: 0.0
        dur:
          type: number
          title: Dur
          default: 0.0
        bpm:
          type: number
          title: Bpm
          default: 0.0
        key:
          type: integer
          title: Key
          default: -1
      type: object
      required:
      - deck
      title: DeckOut
    EngineSnapshot:
      properties:
        reachable:
          type: boolean
          title: Reachable
        engine_mode:
          type: string
          title: Engine Mode
          default: auto
        xfader:
          type: number
          title: Xfader
          default: 0.5
        automix_state:
          type: integer
          title: Automix State
          default: 0
        transition_seconds:
          type: number
          title: Transition Seconds
          default: 8.0
        decks:
          items:
            $ref: '#/components/schemas/DeckOut'
          type: array
          title: Decks
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - reachable
      title: EngineSnapshot
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IntentIn:
      properties:
        text:
          type: string
          maxLength: 1500
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
      - text
      title: IntentIn
    IntentOut:
      properties:
        intent:
          type: string
          title: Intent
        parameters:
          type: object
          title: Parameters
        confidence:
          type: number
          title: Confidence
        source:
          type: string
          title: Source
        fallback_reasons:
          items:
            type: string
          type: array
          title: Fallback Reasons
        mode:
          $ref: '#/components/schemas/Mode'
        outcome:
          type: string
          enum:
          - informational
          - proposal
          - executed
          - rejected
          title: Outcome
        message:
          type: string
          title: Message
        proposal:
          anyOf:
          - $ref: '#/components/schemas/ProposalOut'
          - type: 'null'
        commands:
          items:
            $ref: '#/components/schemas/CommandOut'
          type: array
          title: Commands
        plan:
          anyOf:
          - $ref: '#/components/schemas/PlanOut'
          - type: 'null'
      type: object
      required:
