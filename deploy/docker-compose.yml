# AUDIT SOUND — despliegue Opción B en Coolify (Hetzner).
# Tres servicios: icecast (stream), engine (DJ autónomo), web (frontend).
#
# En Coolify: crear un recurso "Docker Compose", apuntar a este archivo, definir
# las variables de entorno (ver deploy/.env.example) y asignar dominios a los
# servicios `web` (p.ej. www.audit-ia) e `icecast` (p.ej. stream.audit-ia). Coolify
# pone el proxy y el TLS (Let's Encrypt) delante; no publiques puertos a mano en
# producción salvo que no uses el proxy.
#
# IMPORTANTE: las contraseñas van en variables de entorno de Coolify, NUNCA aquí.

services:
  icecast:
    build:
      context: ..
      dockerfile: deploy/icecast/Dockerfile
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_MAX_CLIENTS: ${ICECAST_MAX_CLIENTS:-50}
    # Para probar sin el proxy de Coolify, descomentar:
    # ports:
    #   - "8000:8000"
    restart: unless-stopped

  engine:
    build:
      context: ..
      dockerfile: deploy/engine/Dockerfile
    depends_on:
      - icecast
    environment:
      AUDIT_SOUND_MUSIC_DIR: /music
      AUDIT_SOUND_ICECAST_HOST: icecast          # red interna de compose
      AUDIT_SOUND_ICECAST_PORT: "8000"
      AUDIT_SOUND_ICECAST_MOUNT: /stream.mp3
      AUDIT_SOUND_ICECAST_USER: source
      AUDIT_SOUND_ICECAST_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      # Fuente Subsonic/Navidrome (opcional; si se define, tiene prioridad):
      AUDIT_SOUND_SUBSONIC_URL: ${AUDIT_SOUND_SUBSONIC_URL:-}
      AUDIT_SOUND_SUBSONIC_USER: ${AUDIT_SOUND_SUBSONIC_USER:-}
      AUDIT_SOUND_SUBSONIC_PASS: ${AUDIT_SOUND_SUBSONIC_PASS:-}
      AUDIT_SOUND_SUBSONIC_PLAYLIST: ${AUDIT_SOUND_SUBSONIC_PLAYLIST:-}
      AUDIT_SOUND_TRANSITION: ${AUDIT_SOUND_TRANSITION:-8}
      AUDIT_SOUND_MIX_MODE: ${AUDIT_SOUND_MIX_MODE:-0}
    volumes:
      - ${MUSIC_DIR:-./music}:/music:ro          # tu biblioteca (solo lectura)
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    environment:
      # URL PÚBLICA del stream (dominio del servicio icecast en Coolify):
      STREAM_URL: ${STREAM_URL:-}
    # Para probar sin el proxy de Coolify, descomentar:
    # ports:
    #   - "8080:80"
    restart: unless-stopped
