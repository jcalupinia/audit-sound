# AUDIT SOUND — despliegue Opción B en Coolify (Hetzner).
# Cuatro servicios: icecast (stream), engine (DJ autónomo), dj-agent (agente DJ, interno), web (frontend).
#
# En Coolify: crear un recurso "Docker Compose", apuntar a este archivo, definir
# las variables de entorno (ver deploy/.env.example). UN SOLO DOMINIO: asigna dominio solo
# al servicio `web` (p.ej. audit-sound.audit-ia.ec); el `web` sirve la página y proxya el
# stream en /stream.mp3, así que `icecast` queda INTERNO (sin dominio). Coolify pone el
# proxy y el TLS (Let's Encrypt) delante; no publiques puertos a mano en producción.
#
# IMPORTANTE: las contraseñas van en variables de entorno de Coolify, NUNCA aquí.

services:
  icecast:
    build:
      context: ..
      dockerfile: deploy/icecast/Dockerfile
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_MAX_CLIENTS: ${ICECAST_MAX_CLIENTS:-50}
    # Para probar sin el proxy de Coolify, descomentar:
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  engine:
    build:
      context: ..
      dockerfile: deploy/engine/Dockerfile
    depends_on:
      - icecast
    environment:
      AUDIT_SOUND_MUSIC_DIR: /music
      AUDIT_SOUND_ICECAST_HOST: icecast          # red interna de compose
      AUDIT_SOUND_ICECAST_PORT: "8000"
      AUDIT_SOUND_ICECAST_MOUNT: /stream.mp3
      AUDIT_SOUND_ICECAST_USER: source
      AUDIT_SOUND_ICECAST_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      # Fuente Subsonic/Navidrome (opcional; si se define, tiene prioridad):
      AUDIT_SOUND_SUBSONIC_URL: ${AUDIT_SOUND_SUBSONIC_URL:-}
      AUDIT_SOUND_SUBSONIC_USER: ${AUDIT_SOUND_SUBSONIC_USER:-}
      AUDIT_SOUND_SUBSONIC_PASS: ${AUDIT_SOUND_SUBSONIC_PASS:-}
      AUDIT_SOUND_SUBSONIC_PLAYLIST: ${AUDIT_SOUND_SUBSONIC_PLAYLIST:-}
      # Biblioteca libre incluida en la imagen: latina (por defecto) | house | todas.
      AUDIT_SOUND_BIBLIOTECA: ${AUDIT_SOUND_BIBLIOTECA:-latina}
      AUDIT_SOUND_TRANSITION: ${AUDIT_SOUND_TRANSITION:-8}
      AUDIT_SOUND_MIX_MODE: ${AUDIT_SOUND_MIX_MODE:-0}
      # Ajustes del AutoMix (vacío = comportamiento por defecto; ver docs/dj-agent/19 y 20):
      #   MIX_POINT=silence · TEMPO_RETURN=0 · MIX_MAX_ADELANTO (s) · INTRO_SALTO=0 · INTRO_MAX (s) · BREAK_SALTO=0
      AUDIT_SOUND_MIX_POINT: ${AUDIT_SOUND_MIX_POINT:-}
      AUDIT_SOUND_TEMPO_RETURN: ${AUDIT_SOUND_TEMPO_RETURN:-}
      AUDIT_SOUND_MIX_MAX_ADELANTO: ${AUDIT_SOUND_MIX_MAX_ADELANTO:-}
      AUDIT_SOUND_INTRO_SALTO: ${AUDIT_SOUND_INTRO_SALTO:-}
      AUDIT_SOUND_INTRO_MAX: ${AUDIT_SOUND_INTRO_MAX:-}
      AUDIT_SOUND_BREAK_SALTO: ${AUDIT_SOUND_BREAK_SALTO:-}
      # Audio de DEMO: si /music está vacío y no hay Subsonic, suena una demo sintética
      # (para probar el Preview sin subir música). Pon tu biblioteca en /music para
      # reemplazarla, o pon AUDIT_SOUND_DEMO=0 para exigir fuente propia.
      AUDIT_SOUND_DEMO: ${AUDIT_SOUND_DEMO:-1}
      # Control API (M5): login + comandos para el frontend.
      AUDIT_SOUND_API_USER: ${AUDIT_SOUND_API_USER:-}
      AUDIT_SOUND_API_PASS: ${AUDIT_SOUND_API_PASS:-}
      AUDIT_SOUND_API_PORT: "8787"
      # Endurecimiento A1.3: allowlist CORS (coma-separada). Vacío → "*" (retrocompat).
      AUDIT_SOUND_API_ORIGIN: ${AUDIT_SOUND_API_ORIGIN:-}
    # Para probar sin el proxy de Coolify, descomentar (y asignar dominio api.audit-ia.ec):
    # ports:
    #   - "8787:8787"
    volumes:
      # Volumen con nombre (vacío por defecto → suena la DEMO). Para usar TU música,
      # sustituir por un bind:  - ${MUSIC_DIR}:/music:ro
      - audit_music:/music:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]udit_sound_server' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Agente DJ (Fases 1–6). INTERNO: sin dominio ni puertos publicados. La consola v0.6
  # (deploy/pro, sound.audit-ia.ec) llega a él por su proxy con DJ_AGENT_URL. Controla el
  # motor por la Control API interna (engine:8787). Si se cae, el motor sigue con AutoMix.
  # Guía: deploy/DESPLEGAR_AGENTE_DJ.md
  dj-agent:
    build:
      context: ../services/dj-agent
      dockerfile: Dockerfile
    depends_on:
      - engine
    environment:
      DJ_AGENT_ENGINE: control_api
      DJ_AGENT_ENGINE_URL: http://engine:8787
      # Misma cuenta del Control API que define el motor (un solo controlador a la vez).
      DJ_AGENT_ENGINE_USER: ${AUDIT_SOUND_API_USER:-}
      DJ_AGENT_ENGINE_PASS: ${AUDIT_SOUND_API_PASS:-}
      # Llaves de respaldo (token:usuario:rol:org;...). SECRETO: solo en Coolify.
      DJ_AGENT_DEV_TOKENS: ${DJ_AGENT_DEV_TOKENS:-}
      # Login unificado (Fase 7): el agente acepta la sesión AUDIT-IA de la consola. DJ_AGENT_CC_API = el mismo
      # valor que AUDIT_SOUND_CC_API de la consola. Roles por correo: correo:admin;correo2:operator.
      DJ_AGENT_CC_API: ${DJ_AGENT_CC_API:-}
      DJ_AGENT_CC_ROLES: ${DJ_AGENT_CC_ROLES:-}
      DJ_AGENT_CC_DEFAULT_ROLE: ${DJ_AGENT_CC_DEFAULT_ROLE:-listener}
      # IA: mismas variables que auditbrain-backend. El servidor Qwen está en la tailnet:
      # este servidor debe estar unido a Tailscale (como el backend) para alcanzarlo.
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DJ_AGENT_LLM_TIMEOUT_SECONDS: ${DJ_AGENT_LLM_TIMEOUT_SECONDS:-8}
      DJ_AGENT_LLM_BUDGET_USD_DAY: ${DJ_AGENT_LLM_BUDGET_USD_DAY:-1.0}
      DJ_AGENT_LLM_BUDGET_USD_SESSION: ${DJ_AGENT_LLM_BUDGET_USD_SESSION:-0.25}
    volumes:
      - dj_agent_data:/data      # sesiones, auditoría y token del motor (SQLite)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8790/api/v1/dj-agent/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    environment:
      # URL PÚBLICA del stream (dominio del servicio icecast en Coolify):
      STREAM_URL: ${STREAM_URL:-}
      # URL PÚBLICA de la Control API (dominio del puerto 8787 del engine en Coolify):
      API_URL: ${API_URL:-}
    # Para probar sin el proxy de Coolify, descomentar:
    # ports:
    #   - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  audit_music:   # biblioteca del DJ (vacío por defecto → suena la demo sintética)
  dj_agent_data: # base del agente DJ (sesiones, auditoría, consumo de IA)
