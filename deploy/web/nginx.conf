# AUDIT SOUND — servidor web del streaming (Modo C).
# Sirve la página estática y hace de PROXY del stream en el MISMO dominio:
#   https://<tu-dominio>/stream.mp3  ->  icecast interno (icecast:8000)
# Así todo vive en UNA sola URL (mismo origen, HTTPS), sin exponer Icecast ni
# caer en "mezcla de contenido" (la causa nº1 de que iOS no reproduzca).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cortar el ruido de escáneres automáticos (WordPress, phpMyAdmin, etc.):
  # cierra la conexión sin responder (444) y sin registrar en el log.
  location ~* ^/(wp-admin|wp-login|wp-json|wp-content|wp-includes|xmlrpc\.php|wordpress|phpmyadmin|phpunit) {
    access_log off;
    return 444;
  }

  # Denegar archivos ocultos (p. ej. /.env, /.git), salvo /.well-known.
  location ~ /\.(?!well-known) {
    access_log off;
    return 444;
  }

  # El stream en vivo, servido por el propio dominio (proxy al Icecast interno).
  # proxy_buffering off: es un flujo continuo, no se debe almacenar.
  location = /stream.mp3 {
    proxy_pass http://icecast:8000/stream.mp3;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header Cache-Control no-cache;
  }

  # Página estática (landing de escucha). SPA-friendly.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
