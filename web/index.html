<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDIT SOUND</title>
<style>
  :root{
    --bg:#071B2F; --card:#0A2342; --btn:#0E2C50; --gold:#C7A83C;
    --text:#E8EEF5; --muted:#8FA6BF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; gap:28px; text-align:center;
  }
  .brand{letter-spacing:.18em; font-size:14px; color:var(--muted); text-transform:uppercase}
  h1{margin:0; font-size:clamp(28px,8vw,44px); font-weight:700}
  h1 .gold{color:var(--gold)}
  .card{
    background:var(--card); border-radius:18px; padding:26px 22px; width:100%; max-width:420px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  #now{font-size:15px; color:var(--muted); min-height:20px; margin-bottom:18px}
  #now b{color:var(--text)}
  button{
    appearance:none; border:none; cursor:pointer; width:100%;
    background:var(--gold); color:#13233a; font-weight:700; font-size:18px;
    padding:16px 20px; border-radius:12px; transition:transform .05s ease, filter .2s;
  }
  button:active{transform:scale(.98)}
  button.stop{background:var(--btn); color:var(--text)}
  button:disabled{filter:grayscale(.5) opacity(.6); cursor:default}
  #panel input, #panel select{width:100%; padding:11px 12px; margin:6px 0; border-radius:10px; border:1px solid #1e3a5c; background:#0b2138; color:var(--text); font-size:15px}
  #loginMsg{color:#f85149; font-size:13px; min-height:16px}
  #np{font-size:16px; color:var(--text); margin-bottom:12px; font-weight:600}
  .ctl{display:block; text-align:left; font-size:13px; color:var(--muted); margin-top:14px}
  .ctl input[type=range]{margin-top:6px}
  #status{margin-top:14px; font-size:13px; color:var(--muted); min-height:18px}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; vertical-align:middle}
  .dot.live{background:#3fb950}
  .dot.err{background:#f85149}
  footer{font-size:11px; color:var(--muted); opacity:.7}
</style>
</head>
<body>
  <div class="brand">DJ autónomo</div>
  <h1>AUDIT <span class="gold">SOUND</span></h1>

  <div class="card">
    <div id="now">Listo para escuchar tu sesión.</div>
    <button id="btn">▶ Escuchar</button>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">Detenido</span></div>
  </div>

  <!-- Panel de control (M5): visible si hay API configurada (config.js o ?api=). -->
  <div class="card" id="panel" hidden>
    <div id="login">
      <input id="u" placeholder="usuario" autocomplete="username">
      <input id="pw" type="password" placeholder="clave" autocomplete="current-password">
      <button id="loginBtn">Entrar al control</button>
      <div id="loginMsg"></div>
    </div>
    <div id="controls" hidden>
      <div id="np">—</div>
      <button id="skipBtn" class="stop">⏭ Siguiente pista</button>
      <label class="ctl">Transición: <span id="ttVal">8</span> s
        <input id="tt" type="range" min="2" max="20" value="8"></label>
      <label class="ctl">Modo de mezcla:
        <select id="mode">
          <option value="0">Saltar silencio</option>
          <option value="1">Pista completa</option>
        </select></label>
    </div>
  </div>

  <footer>Stream MP3 vía Icecast · AUDIT SOUND</footer>

  <!-- El audio es un stream continuo tipo radio (Opción B): suena también con la
       pantalla bloqueada, porque es un <audio> que reproduce un stream, no
       procesamiento Web Audio del lado cliente. -->
  <audio id="player" preload="none" playsinline></audio>

  <!-- config.js lo genera el contenedor web a partir de STREAM_URL (Coolify).
       Opcional: si no existe, se usa ?stream= o <origin>/stream.mp3. -->
  <script src="config.js" onerror="void 0"></script>
<script>
(function(){
  // URL del stream: ?stream=... o, por defecto, mismo host /stream.mp3.
  // En producción se sirve desde el Icecast en Coolify (p.ej. https://stream.audit-ia/stream.mp3).
  var params = new URLSearchParams(location.search);
  var STREAM = params.get('stream') ||
               (typeof window.AUDIT_SOUND_STREAM === 'string' && window.AUDIT_SOUND_STREAM) ||
               (location.origin + '/stream.mp3');

  var player = document.getElementById('player');
  var btn = document.getElementById('btn');
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var now = document.getElementById('now');
  var playing = false;

  function setStatus(text, cls){
    statusText.textContent = text;
    dot.className = 'dot' + (cls ? ' ' + cls : '');
  }

  // --- Media Session API (E2): metadatos + controles de pantalla de bloqueo ---
  // Un escudo dorado inline (data URI) como carátula; sin recursos externos.
  var ARTWORK = 'data:image/svg+xml;base64,' + btoa(
    '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">' +
    '<rect width="512" height="512" fill="#071B2F"/>' +
    '<circle cx="256" cy="256" r="150" fill="none" stroke="#C7A83C" stroke-width="20"/>' +
    '<circle cx="256" cy="256" r="52" fill="#C7A83C"/></svg>');

  function setupMediaSession(){
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Sesión en vivo',
        artist: 'AUDIT SOUND',
        album: 'DJ autónomo',
        artwork: [
          { src: ARTWORK, sizes: '512x512', type: 'image/svg+xml' }
        ]
      });
      navigator.mediaSession.setActionHandler('play', function(){ start(); });
      navigator.mediaSession.setActionHandler('pause', function(){ stop(); });
      navigator.mediaSession.setActionHandler('stop', function(){ stop(); });
    } catch (e) { /* algunos navegadores no soportan todos los handlers */ }
  }
  function setPlaybackState(state){
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.playbackState = state; } catch (e) {}
    }
  }

  function start(){
    // Cache-busting para forzar reconexión limpia al stream en vivo.
    player.src = STREAM + (STREAM.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    player.load();
    var p = player.play();
    if (p && p.catch) p.catch(function(err){ setStatus('No se pudo iniciar: ' + err.message, 'err'); });
  }
  function stop(){
    player.pause();
    player.removeAttribute('src');
    player.load();
  }

  btn.addEventListener('click', function(){
    if (!playing) start(); else stop();
  });

  player.addEventListener('playing', function(){
    playing = true;
    btn.textContent = '⏸ Detener';
    btn.classList.add('stop');
    setStatus('En vivo', 'live');
    now.innerHTML = 'Reproduciendo <b>tu sesión AUDIT SOUND</b>';
    setupMediaSession();
    setPlaybackState('playing');
  });
  player.addEventListener('pause', function(){
    playing = false;
    btn.textContent = '▶ Escuchar';
    btn.classList.remove('stop');
    setStatus('Detenido');
    now.textContent = 'Listo para escuchar tu sesión.';
    setPlaybackState('paused');
  });
  player.addEventListener('waiting', function(){ setStatus('Conectando…'); });
  player.addEventListener('stalled', function(){ setStatus('Reconectando…'); });
  player.addEventListener('error', function(){ setStatus('Error de stream', 'err'); });

  // --- Panel de control (M5) ---
  var API = params.get('api') ||
            (typeof window.AUDIT_SOUND_API === 'string' && window.AUDIT_SOUND_API) || '';
  var token = null, pollTimer = null;
  var panel = document.getElementById('panel');
  if (API) panel.hidden = false;

  function byId(x){ return document.getElementById(x); }
  function cmd(action, value){
    var u = API + '/api/command?token=' + token + '&action=' + action +
            (value != null ? '&value=' + encodeURIComponent(value) : '');
    return fetch(u, { method: 'POST' });
  }
  function poll(){
    fetch(API + '/api/status?token=' + token).then(function(r){ return r.json(); })
      .then(function(d){
        byId('np').textContent = (d.nowPlaying || '—') +
          (d.bpm > 0 ? ' · ' + Math.round(d.bpm) + ' BPM' : '');
      }).catch(function(){});
  }
  function startPoll(){ if (pollTimer) clearInterval(pollTimer); poll(); pollTimer = setInterval(poll, 2000); }

  if (API) {
    byId('loginBtn').addEventListener('click', function(){
      var u = byId('u').value, pw = byId('pw').value;
      fetch(API + '/api/login?user=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(pw),
            { method: 'POST' })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.token){ token = d.token; byId('login').hidden = true; byId('controls').hidden = false; startPoll(); }
          else byId('loginMsg').textContent = 'Credenciales inválidas';
        })
        .catch(function(){ byId('loginMsg').textContent = 'No se pudo conectar con el control'; });
    });
    byId('skipBtn').addEventListener('click', function(){ cmd('skip'); });
    var tt = byId('tt');
    tt.addEventListener('input', function(){ byId('ttVal').textContent = tt.value; });
    tt.addEventListener('change', function(){ cmd('set_transition', tt.value); });
    byId('mode').addEventListener('change', function(){ cmd('set_mode', this.value); });
  }

  // Exponer para pruebas automatizadas (headless).
  window.__auditSound = { start: start, stop: stop, el: player, streamUrl: STREAM, api: API };
})();
</script>
</body>
</html>
