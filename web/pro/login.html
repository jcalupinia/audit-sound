<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDIT SOUND · Acceso</title>
<meta name="description" content="Acceso al Command Center de AUDIT SOUND — DJ inteligente con IA.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#071B2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AUDIT SOUND">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#05060f;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf2ff}
  .frame{position:relative;width:100%;max-width:960px;margin:auto}
  .frame img{display:block;width:100%;height:auto;border-radius:10px}
  /* Campos funcionales encima de tu imagen (transparentes hasta que se usan) */
  .fld{position:absolute;background:transparent;border:0;outline:none;color:#eaf2ff;
    font-size:clamp(11px,1.8vw,17px);font-family:inherit;padding:0 2%;border-radius:10px}
  .fld::placeholder{color:transparent}            /* el placeholder real está en tu imagen */
  .fld.typing{background:#0c1a2e}                  /* al escribir, tapa el texto de la imagen */
  .hot{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:10px;padding:0}
  .hot:focus-visible,.fld:focus-visible{outline:2px solid #35e06a}
  .panel{width:100%;max-width:960px;margin:14px auto 0;min-height:22px;text-align:center}
  .msg{font-size:13px;color:#93a6c9} .msg.ok{color:#7be0a0} .msg.err{color:#ff8ba0}
  /* Cambio de clave obligatorio (primer ingreso), debajo de la imagen */
  .change{display:none;max-width:420px;margin:12px auto 0;background:#0a1226;border:1px solid #1b2b52;border-radius:14px;padding:16px}
  .change.show{display:block}
  .change p{margin:0 0 10px;font-size:14px;color:#cfe0f7}
  .change input{width:100%;margin:0 0 10px;padding:12px 14px;border-radius:10px;border:1px solid #28406a;
    background:#0e1a30;color:#eaf2ff;font-size:15px}
  .change button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;
    color:#06220f;background:linear-gradient(180deg,#5cf08a,#23c457)}
</style>
</head>
<body>
  <div class="frame">
    <img src="./assets/landing_login.webp" alt="AUDIT SOUND — Acceso al Command Center. DJ inteligente con IA." fetchpriority="high">
    <!-- Usuario -->
    <input class="fld" id="user" type="text" autocomplete="username" aria-label="Usuario o email corporativo"
           style="left:55.5%;top:45.8%;width:38%;height:6.4%">
    <!-- Contraseña -->
    <input class="fld" id="pass" type="password" autocomplete="current-password" aria-label="Contraseña"
           style="left:55.5%;top:52.9%;width:32%;height:6.4%">
    <!-- Mostrar/ocultar contraseña -->
    <button class="hot" id="eye" type="button" aria-label="Mostrar u ocultar la contraseña"
            style="left:88.5%;top:52.9%;width:6.5%;height:6.4%"></button>
    <!-- Ingresar -->
    <button class="hot" id="go" type="button" aria-label="Ingresar"
            style="left:54.5%;top:62.2%;width:40%;height:7.4%"></button>
    <!-- Recordar mi sesión -->
    <button class="hot" id="remember" type="button" aria-pressed="true" aria-label="Recordar mi sesión"
            style="left:55%;top:70%;width:16%;height:5%"></button>
    <!-- ¿Olvidaste tu contraseña? -->
    <button class="hot" id="forgot" type="button" aria-label="¿Olvidaste tu contraseña?"
            style="left:78.5%;top:70%;width:17%;height:5%"></button>
  </div>

  <div class="panel"><div class="msg" id="msg"></div></div>

  <!-- Cambio de clave obligatorio (primer ingreso) -->
  <form class="change" id="changeForm" autocomplete="off">
    <p>Por seguridad, define tu propia contraseña para entrar a AUDIT SOUND.</p>
    <input id="np1" type="password" placeholder="Nueva contraseña (mín. 8)" autocomplete="new-password">
    <input id="np2" type="password" placeholder="Repite la nueva contraseña" autocomplete="new-password">
    <button type="submit">Guardar y entrar</button>
    <div class="msg" id="chgmsg" style="margin-top:8px"></div>
  </form>

<script src="config.js" onerror="void 0"></script>
<script type="module">
  import * as CC from './commandcenter.js';
  const $ = (s) => document.querySelector(s);
  // Ya autenticado -> a la pantalla de elección
  if (CC.isAuthed()) location.replace('./index.html');

  const msg = $('#msg');
  if (!CC.configured()) {
    msg.className = 'msg';
    msg.textContent = CC.demoAllowed()
      ? 'Modo demostración habilitado: cualquier usuario entra, solo para navegar el front.'
      : 'El inicio de sesión aún no está configurado. Contacta al administrador.';
  }

  // Los campos tapan el texto de tu imagen solo cuando se usan.
  for (const id of ['#user', '#pass']) {
    const el = $(id);
    const sync = () => el.classList.toggle('typing', document.activeElement === el || el.value.length > 0);
    el.addEventListener('focus', sync); el.addEventListener('blur', sync); el.addEventListener('input', sync);
  }
  // Ojo de contraseña
  $('#eye').addEventListener('click', () => { const p = $('#pass'); p.type = p.type === 'password' ? 'text' : 'password'; p.focus(); });
  // Recordar sesión (estado interno; tu imagen no cambia)
  let remember = true;
  $('#remember').addEventListener('click', () => { remember = !remember; $('#remember').setAttribute('aria-pressed', String(remember)); msg.className='msg'; msg.textContent = remember ? 'Recordar mi sesión: activado.' : 'Recordar mi sesión: desactivado.'; });
  $('#forgot').addEventListener('click', () => { msg.className='msg'; msg.textContent = 'La gestión de usuarios y claves se hace en el Command Center (AuditBrain).'; });

  let lastPass = '';
  async function doLogin() {
    msg.className = 'msg'; msg.textContent = 'Ingresando…';
    lastPass = $('#pass').value;
    const r = await CC.login($('#user').value, lastPass, remember);
    if (r.ok) {
      msg.className = 'msg ok';
      if (r.passwordResetRequired && !r.demo) {
        msg.textContent = 'Acceso correcto. Define tu nueva contraseña para continuar.';
        $('#changeForm').classList.add('show'); $('#np1').focus(); return;
      }
      msg.textContent = r.demo ? 'Acceso (demo). Abriendo…' : 'Acceso correcto. Abriendo…';
      location.href = './index.html';
    } else { msg.className = 'msg err'; msg.textContent = r.error || 'No se pudo iniciar sesión.'; }
  }
  $('#go').addEventListener('click', doLogin);
  $('#pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('#user').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#pass').focus(); });

  // Cambio de clave en el primer ingreso
  $('#changeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const m = $('#chgmsg'); const np1 = $('#np1').value, np2 = $('#np2').value;
    if (np1 !== np2) { m.className = 'msg err'; m.textContent = 'Las contraseñas no coinciden.'; return; }
    m.className = 'msg'; m.textContent = 'Guardando…';
    const r = await CC.changePassword(lastPass, np1);
    if (r.ok) { m.className = 'msg ok'; m.textContent = 'Contraseña actualizada. Abriendo…'; location.href = './index.html'; }
    else { m.className = 'msg err'; m.textContent = r.error || 'No se pudo cambiar la contraseña.'; }
  });
</script>
</body>
</html>
