<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDIT SOUND · En vivo</title>
<meta name="description" content="Estás escuchando AUDIT SOUND — música continua, mezcla en vivo, 24/7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;0,9..40,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060f; --card:#0a1226; --card2:#0b1530; --line:#1b2b52;
    --text:#eaf2ff; --muted:#93a6c9; --green:#36e26a; --cyan:#30c6ff; --magenta:#ff5bd0; --violet:#7a5cff; --red:#ff3b57;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#05060f;color:var(--text);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
    -webkit-font-smoothing:antialiased}
  .bgfx{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(800px 400px at 30% 0%,#15215a 0%,rgba(5,6,15,0) 60%),
    radial-gradient(800px 500px at 80% 100%,#2a1157 0%,rgba(5,6,15,0) 60%),#05060f}

  .player{width:100%;max-width:520px;border-radius:26px;padding:3px;
    background:linear-gradient(135deg,var(--violet),var(--cyan) 45%,var(--magenta));
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(122,92,255,.18)}
  .inner{border-radius:23px;background:linear-gradient(180deg,#0b1530,#070d20);padding:22px 20px 20px;overflow:hidden;position:relative}

  .pl-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .name{font-weight:800;letter-spacing:.05em;font-size:19px;line-height:1}
  .logo .name .g{color:var(--green)}
  .logo .sub{font-size:9px;letter-spacing:.3em;color:var(--muted);margin-top:4px;font-weight:600}
  .live-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;font-weight:800;font-size:13px;
    color:#fff;background:linear-gradient(180deg,#ff4d66,#e01f3d);box-shadow:0 0 20px rgba(255,59,87,.45)}
  .live-pill .rb{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

  .now-line{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:700;font-size:13px;margin:16px 2px 6px}
  .now-line .d{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}

  .stage{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
  .eq{display:flex;align-items:flex-end;gap:4px;height:92px;flex:1}
  .eq i{width:7px;border-radius:4px;background:linear-gradient(180deg,var(--cyan),var(--violet));opacity:.9;animation:bar 1s ease-in-out infinite}
  .eq i:nth-child(odd){background:linear-gradient(180deg,var(--green),var(--cyan))}
  .eq.paused i{animation-play-state:paused;opacity:.4}
  @keyframes bar{0%,100%{height:22%}50%{height:90%}}
  .phones{opacity:.9}

  h1.listening{font-size:16px;color:var(--muted);font-weight:600;margin:12px 2px 0}
  h1.listening b{display:block;color:var(--text);font-size:34px;font-weight:900;letter-spacing:-.01em;line-height:1.05;margin-top:2px}
  .meta{color:var(--muted);font-size:14px;margin:8px 2px 14px}
  .chip{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;border:1.5px solid rgba(54,226,106,.7);
    color:#8dffb0;font-weight:800;font-size:13px;background:rgba(54,226,106,.06);box-shadow:0 0 18px rgba(54,226,106,.14) inset}
  .chip .cpu{display:inline-flex;width:22px;height:22px;border-radius:6px;background:rgba(54,226,106,.16);align-items:center;justify-content:center;color:var(--green)}

  .sep{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0}

  .track{display:flex;align-items:center;gap:14px}
  .cover{width:62px;height:62px;border-radius:13px;flex:none;background:
    radial-gradient(60px 40px at 30% 20%,rgba(255,91,208,.5),transparent 70%),linear-gradient(150deg,#3a1f6b,#10233f);
    border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
  .track .info{min-width:0;flex:1}
  .track .k{color:var(--muted);font-size:12px}
  .track .t{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .a{color:var(--muted);font-size:13px}
  .wave{display:flex;align-items:center;gap:3px;height:34px}
  .wave i{width:3px;border-radius:3px;background:linear-gradient(180deg,var(--cyan),var(--magenta));animation:bar 1.1s ease-in-out infinite}
  .wave.paused i{animation-play-state:paused;opacity:.4}

  .controls{display:flex;align-items:center;gap:14px;margin-top:20px}
  .play{width:56px;height:56px;border-radius:50%;flex:none;border:none;cursor:pointer;color:#06220f;
    background:linear-gradient(180deg,#5cf08a,#23c457);box-shadow:0 10px 26px rgba(54,226,106,.4);
    display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .play:hover{transform:scale(1.05)}
  .vol{display:flex;align-items:center;gap:10px;flex:1}
  .vol svg{color:var(--muted);flex:none}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:#17264a;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:#eafff2;box-shadow:0 0 0 3px rgba(54,226,106,.6);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:#eafff2;box-shadow:0 0 0 3px rgba(54,226,106,.6);cursor:pointer}
  .vfill{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--cyan));margin-top:-6px;pointer-events:none}
  .cbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:#cfe0f7;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:border-color .15s,background .15s}
  .cbtn:hover{border-color:var(--green);background:rgba(54,226,106,.08)}

  .compat{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px auto 2px;max-width:360px;
    padding:12px 18px;border-radius:999px;border:1.5px solid rgba(54,226,106,.5);background:rgba(54,226,106,.05)}
  .compat .lbl{position:absolute;transform:translateY(-26px);font-size:11px;color:var(--muted);font-weight:700}
  .compat span{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
  .compat .sepv{width:1px;height:20px;background:var(--line)}

  .msg{margin-top:14px;text-align:center;font-size:13px;color:var(--muted);min-height:18px}
  .msg.err{color:#ff8ba0}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin:16px 2px 0}
  .back:hover{color:var(--text)}
  svg{display:block}
</style>
</head>
<body>
  <!-- Puerta de acceso: sin sesión, al login (antes de pintar, sin parpadeo). -->
  <script>try{if(!localStorage.getItem('auditsound.cc.token'))location.replace('./login.html');}catch(e){location.replace('./login.html');}</script>
  <div class="bgfx" aria-hidden="true"></div>

  <div class="player">
    <div class="inner">
      <div class="pl-top">
        <div class="logo">
          <svg width="30" height="30" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <g stroke="#36e26a" stroke-width="3" stroke-linecap="round"><line x1="6" y1="26" x2="6" y2="22"/><line x1="12" y1="30" x2="12" y2="18"/><line x1="18" y1="34" x2="18" y2="14"/></g>
            <g stroke="#30c6ff" stroke-width="3" stroke-linecap="round"><line x1="24" y1="31" x2="24" y2="17"/><line x1="30" y1="36" x2="30" y2="12"/><line x1="36" y1="30" x2="36" y2="18"/><line x1="42" y1="27" x2="42" y2="21"/></g>
          </svg>
          <div><div class="name">AUDIT <span class="g">SOUND</span></div><div class="sub">DJ · MÚSICA · EVENTOS · IA</div></div>
        </div>
        <span class="live-pill"><span class="rb"></span>EN VIVO</span>
      </div>

      <div class="now-line"><span class="d"></span> Transmitiendo ahora</div>

      <div class="stage">
        <div class="eq paused" id="eq"></div>
        <svg class="phones" width="92" height="92" viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <path d="M22 56 V46 a26 26 0 0 1 52 0 V56" fill="none" stroke="#bfe9ff" stroke-width="5" stroke-linecap="round"/>
          <rect x="15" y="52" width="16" height="26" rx="7" fill="#0e1838" stroke="#30c6ff" stroke-width="3"/>
          <rect x="65" y="52" width="16" height="26" rx="7" fill="#0e1838" stroke="#ff5bd0" stroke-width="3"/>
        </svg>
      </div>

      <h1 class="listening">Estás escuchando <b>Audit Sound</b></h1>
      <div class="meta">Música continua · Mezcla en vivo · 24/7</div>
      <span class="chip"><span class="cpu"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3" stroke-linecap="round"/></svg></span>DJ con IA</span>

      <div class="sep"></div>

      <div class="track">
        <div class="cover"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffd0f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
        <div class="info">
          <div class="k">Ahora suena</div>
          <div class="t" id="trackTitle">Transmisión en vivo</div>
          <div class="a" id="trackArtist">AUDIT SOUND · DJ con IA</div>
        </div>
        <div class="wave paused" id="wave"></div>
      </div>

      <div class="controls">
        <button class="play" id="play" aria-label="Reproducir">
          <svg id="icoPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icoPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <div class="vol">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
          <div style="flex:1">
            <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen">
            <div class="vfill" id="vfill"></div>
          </div>
        </div>
        <button class="cbtn" id="share" title="Compartir" aria-label="Compartir"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
        <button class="cbtn" id="full" title="Pantalla completa" aria-label="Pantalla completa"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>

      <div class="compat"><span class="lbl">Compatible con</span>
        <span><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1a4 4 0 0 1-1 3 4 4 0 0 1-3 1 4 4 0 0 1 4-4zm3 8c-1 0-2 .7-3 .7S16 9 14.5 9c-2 0-4 1.6-4 5 0 3 2 7 4 7 1 0 1.5-.6 2.5-.6s1.5.6 2.5.6c2 0 3.5-3.6 3.5-5-2.5-1-2.5-5 0-6-.7-1-1.8-1.6-3.5-1.6z"/></svg> iPhone</span>
        <span class="sepv"></span>
        <span style="color:#a4f7b0"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 9v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9zM4 9v6a1.5 1.5 0 0 0 3 0V9zm13 0v6a1.5 1.5 0 0 0 3 0V9zM8.5 7h7a4 4 0 0 0-7 0zM10 4.2 9.3 3M14 4.2l.7-1.2" stroke="currentColor" stroke-width=".2"/></svg> Android</span>
      </div>

      <div class="msg" id="msg"></div>
      <a class="back" href="./index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Volver</a>
    </div>
  </div>

  <audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script src="config.js" onerror="void 0"></script>
<script type="module">
  import { isAuthed } from './commandcenter.js';
  if (!isAuthed()) location.replace('./login.html');
</script>
<script>
  (function(){
    var $ = function(s){ return document.querySelector(s); };
    // Barras de ecualizador y onda (decorativas).
    var eq = document.getElementById('eq');
    for (var i=0;i<22;i++){ var b=document.createElement('i'); b.style.animationDelay=(-(Math.random()*1)).toFixed(2)+'s'; b.style.animationDuration=(0.7+Math.random()*0.7).toFixed(2)+'s'; eq.appendChild(b); }
    var wave = document.getElementById('wave');
    for (var j=0;j<26;j++){ var w=document.createElement('i'); w.style.height=(20+Math.random()*80)+'%'; w.style.animationDelay=(-(Math.random()*1)).toFixed(2)+'s'; wave.appendChild(w); }

    // Fuente del stream: ?stream= , window.AUDIT_SOUND_STREAM, o /stream.mp3 (mismo origen).
    var params = new URLSearchParams(location.search);
    var stream = params.get('stream') || (typeof window.AUDIT_SOUND_STREAM==='string' && window.AUDIT_SOUND_STREAM) || '';
    var listen = (typeof window.AUDIT_SOUND_LISTEN==='string' && window.AUDIT_SOUND_LISTEN) || '';
    if (!stream) stream = '/stream.mp3';   // por defecto, el proxy del mismo dominio

    var audio = document.getElementById('audio');
    audio.src = stream;
    audio.volume = 0.8;

    var play = document.getElementById('play');
    var icoPlay = document.getElementById('icoPlay'), icoPause = document.getElementById('icoPause');
    var msg = document.getElementById('msg');
    var animOn = function(on){ eq.classList.toggle('paused', !on); wave.classList.toggle('paused', !on); };

    function setPlaying(p){
      icoPlay.style.display = p ? 'none' : 'block';
      icoPause.style.display = p ? 'block' : 'none';
      play.setAttribute('aria-label', p ? 'Pausar' : 'Reproducir');
      animOn(p);
    }
    play.addEventListener('click', function(){
      if (audio.paused){
        audio.load();
        var pr = audio.play();
        msg.className='msg'; msg.textContent='Conectando con la transmisión…';
        if (pr && pr.catch) pr.catch(function(){ /* el evento error lo maneja */ });
      } else { audio.pause(); }
    });
    audio.addEventListener('playing', function(){ setPlaying(true); msg.textContent=''; });
    audio.addEventListener('pause', function(){ setPlaying(false); });
    audio.addEventListener('waiting', function(){ msg.className='msg'; msg.textContent='Cargando…'; });
    audio.addEventListener('error', function(){
      setPlaying(false);
      msg.className='msg err';
      msg.textContent = 'No se pudo conectar con la transmisión en este momento.' + (listen ? '' : '');
      if (listen){ msg.innerHTML = 'No se pudo conectar aquí. <a href="'+listen.replace(/"/g,'&quot;')+'" style="color:#7bdcff">Abrir la transmisión ▸</a>'; }
    });

    // Volumen
    var vol = document.getElementById('vol'), vfill = document.getElementById('vfill');
    function paintVol(){ vfill.style.width = vol.value + '%'; }
    vol.addEventListener('input', function(){ audio.volume = vol.value/100; paintVol(); });
    paintVol();

    // Compartir
    document.getElementById('share').addEventListener('click', function(){
      var data = { title:'AUDIT SOUND · En vivo', text:'Escucha AUDIT SOUND en vivo', url: location.href };
      if (navigator.share){ navigator.share(data).catch(function(){}); }
      else if (navigator.clipboard){ navigator.clipboard.writeText(location.href); msg.className='msg'; msg.textContent='Enlace copiado.'; }
    });
    // Pantalla completa
    document.getElementById('full').addEventListener('click', function(){
      var el = document.documentElement;
      if (!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
      else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
    });

    // Media Session (controles en pantalla de bloqueo del teléfono)
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title:'AUDIT SOUND · En vivo', artist:'DJ con IA · 24/7', album:'AuditConsulting Group' });
      navigator.mediaSession.setActionHandler('play', function(){ audio.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ audio.pause(); });
    }
  })();
</script>
</body>
</html>
