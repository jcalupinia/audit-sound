<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDIT SOUND</title>
<meta name="description" content="AUDIT SOUND — elige tu modo: Mezclar en la consola DJ o Escuchar la transmisión en vivo.">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#05060f;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .frame{position:relative;width:100%;max-width:470px;margin:auto}
  .frame img{display:block;width:100%;height:auto;border-radius:0}
  /* Zonas de clic sobre la imagen (transparentes). */
  .hot{position:absolute;display:block;background:transparent;border:0;cursor:pointer;border-radius:16px}
  .hot:focus-visible{outline:2px solid #36e26a}
  @media(hover:hover){.hot:hover{background:rgba(255,255,255,.04)}}
</style>
</head>
<body>
  <!-- Puerta de acceso: sin sesión, al login (antes de pintar, sin parpadeo). -->
  <script>try{if(!localStorage.getItem('auditsound.cc.token'))location.replace('./login.html');}catch(e){location.replace('./login.html');}</script>

  <div class="frame">
    <img src="./assets/landing_elige.webp" alt="AUDIT SOUND — ¿Qué deseas hacer? Elige tu modo: Mezclar o Escuchar en vivo." fetchpriority="high">
    <!-- Tarjeta "Mezclar" -> consola -->
    <a class="hot" href="./console.html" aria-label="Mezclar: consola DJ profesional"
       style="left:4.5%;top:44%;width:44%;height:37%"></a>
    <!-- Tarjeta "Escuchar en vivo" -> reproductor -->
    <a class="hot" href="./escuchar.html" aria-label="Escuchar en vivo"
       style="left:51%;top:44%;width:44.5%;height:37%"></a>
    <!-- Icono de usuario (arriba derecha) -> salir -->
    <a class="hot" id="hotUser" href="#" aria-label="Salir"
       style="left:86%;top:1.5%;width:12%;height:7.5%"></a>
  </div>

<script src="config.js" onerror="void 0"></script>
<script type="module">
  import { isAuthed, logout } from './commandcenter.js';
  if (!isAuthed()) location.replace('./login.html');
  const u = document.getElementById('hotUser');
  if (u) u.addEventListener('click', (e) => { e.preventDefault(); if (confirm('¿Cerrar sesión?')) { logout(); location.replace('./login.html'); } });
</script>
</body>
</html>
