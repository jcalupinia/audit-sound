<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUDIT SOUND · Command Center</title>
<meta name="description" content="AUDIT SOUND — Command Center DJ y producción audiovisual con IA.">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#05060f;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf2ff}
  .frame{position:relative;width:100%;max-width:1680px;margin:0 auto}
  .frame img{display:block;width:100%;height:auto}
  /* Controles funcionales (transparentes) encima de TU imagen */
  .hot{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:10px;padding:0}
  .hot:focus-visible{outline:2px solid #35e06a}
  @media(hover:hover){.hot:hover{background:rgba(255,255,255,.05)}}
  input[type=range].ov{position:absolute;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;margin:0}
  input[type=range].ov::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:28px;background:transparent;cursor:pointer}
  input[type=range].ov::-moz-range-thumb{width:18px;height:28px;background:transparent;border:0;cursor:pointer}
  .bar{width:100%;max-width:1680px;margin:10px auto 0;padding:0 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .bar .status{flex:1;min-width:180px;font-size:13px;color:#93a6c9}
  .bar .status b{color:#eaf2ff}
  .bar .status.err{color:#ff8ba0}
  .hint{font-size:12px;color:#6f84a6}
  svg{display:block}
  /* Fase 1: buscador sobre tu imagen (barra "Buscar en la biblioteca") */
  .ov-text{position:absolute;background:transparent;border:0;outline:none;color:#eaf2ff;
    font-size:clamp(11px,1.1vw,15px);font-family:inherit;padding:0 1%;border-radius:8px}
  .ov-text:focus,.ov-text:not(:placeholder-shown){background:rgba(7,27,47,.92)}
  .ov-text::placeholder{color:transparent}
  /* Panel de resultados (aparece solo al buscar; tema navy/verde, sin rediseñar la imagen) */
  .rpanel{position:absolute;left:1.5%;top:72%;width:62%;max-height:24%;overflow:auto;z-index:5;
    background:rgba(5,10,22,.97);border:1px solid #1b2b52;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;
    position:sticky;top:0;background:#071b2f;border-bottom:1px solid #1b2b52;font-size:12px;color:#9fb6c9}
  .rclose{background:transparent;border:0;color:#9fb6c9;cursor:pointer;font-size:14px}
  .rmsg{padding:14px;color:#93a6c9;font-size:13px}.rmsg.err{color:#ff8ba0}
  .rrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(27,43,82,.6)}
  .rrow:last-child{border-bottom:0}
  .rinfo{flex:1;min-width:0}
  .rt{font-size:13px;color:#eaf2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs{font-size:11px;color:#8aa0bf}
  .racts{display:flex;gap:6px;flex-shrink:0}
  .racts button{padding:5px 9px;border-radius:7px;border:1px solid #2a456e;background:#0e2c50;color:#eaf2ff;
    font-size:12px;font-weight:700;cursor:pointer}
  .racts button:disabled{opacity:.4;cursor:not-allowed}
  .racts button:not(:disabled):hover{background:#36e26a;color:#06220f;border-color:#36e26a}
  /* Capas: los controles núcleo (música/buscador) SIEMPRE reciben el clic por encima
     de los overlays de Fase 2, para que nada se bloquee aunque alguno quede corrido. */
  #importar,#playA,#cueA,#playB,#cueB,#xfader,#master,#hotUser{z-index:4}
  #buscar,#resultados{z-index:6}
</style>
</head>
<body>
  <!-- Puerta de acceso: sin sesión, al login (antes de pintar, sin parpadeo). -->
  <script>try{if(!localStorage.getItem('auditsound.cc.token'))location.replace('./login.html');}catch(e){location.replace('./login.html');}</script>

  <div class="frame" id="frame">
    <img src="./assets/landing_consola.webp" alt="AUDIT SOUND — Command Center: consola DJ, platos A y B, mezclador e IA Copiloto." fetchpriority="high">

    <!-- ===== Parte de MÚSICA cableada al MOTOR WASM real (Fase 0-B) ===== -->
    <!-- Cargar pistas (sobre "Importar Archivos" de la biblioteca) -->
    <button class="hot" id="importar" aria-label="Importar archivos de música" style="left:70.5%;top:73.5%;width:8%;height:12.5%"></button>
    <!-- Plato A: play / cue -->
    <button class="hot" id="playA" aria-label="Reproducir o pausar el plato A" style="left:2.5%;top:63%;width:9%;height:6.4%"></button>
    <button class="hot" id="cueA" aria-label="Cue del plato A" style="left:11.7%;top:63%;width:5.2%;height:6.4%"></button>
    <!-- Plato B: play / cue -->
    <button class="hot" id="playB" aria-label="Reproducir o pausar el plato B" style="left:50.3%;top:63%;width:9%;height:6.4%"></button>
    <button class="hot" id="cueB" aria-label="Cue del plato B" style="left:59.5%;top:63%;width:5.2%;height:6.4%"></button>
    <!-- Crossfader -->
    <input class="ov" id="xfader" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Crossfader" style="left:36.3%;top:64.6%;width:11%;height:4%">
    <!-- Volumen master (footer) -->
    <input class="ov" id="master" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volumen master" style="left:85%;top:95%;width:9.5%;height:3.5%">
    <!-- Icono de usuario (arriba derecha) -> salir -->
    <button class="hot" id="hotUser" aria-label="Salir" style="left:95%;top:1.5%;width:4.5%;height:7%"></button>

    <!-- Buscador (sobre la barra "Buscar en la biblioteca…" de tu imagen) -->
    <input class="ov-text" id="buscar" type="search" autocomplete="off"
           placeholder="Buscar en la biblioteca…" aria-label="Buscar música en la biblioteca y fuentes"
           style="left:18.5%;top:68%;width:36.5%;height:3.4%">
    <!-- Panel de resultados (aparece solo al buscar) -->
    <div class="rpanel" id="resultados" style="display:none" role="listbox" aria-label="Resultados de búsqueda"></div>

    <!-- selector de archivos oculto -->
    <input id="fileIn" type="file" accept="audio/*" multiple style="display:none">
  </div>

  <div class="bar">
    <div class="status" id="status">Música con el motor real (Fase 0-B): toca <b>Importar Archivos</b> para cargar pistas en A y B, luego los botones <b>▶❚❚</b>. El crossfader mezcla A↔B y el control de la derecha es el volumen. EQ, loops y hotcues llegan en la Fase 2; el video en el Bloque 2.</div>
    <span class="hint">v2 · motor WASM</span>
  </div>

<script src="config.js" onerror="void 0"></script>
<script type="module">
  import { isAuthed, logout } from './commandcenter.js';
  import { AudioBridge } from './audio_bridge.js';
  import * as LIB from './library.js';
  import { setupSearch } from './console_search.js';
  import { setupMixer } from './console_mixer.js';
  if (!isAuthed()) location.replace('./login.html');

  const $ = (s) => document.getElementById(s);
  const status = $('status');
  const say = (t, err) => { status.className = 'status' + (err ? ' err' : ''); status.innerHTML = t; };

  // Cerrar sesión (icono de usuario de tu imagen)
  $('hotUser').addEventListener('click', () => { if (confirm('¿Cerrar sesión?')) { logout(); location.replace('./login.html'); } });

  // Motor de audio REAL (WASM + AudioWorklet), el mismo de mixer.html.
  const bridge = new AudioBridge();
  const loaded = [false, false];
  const playing = [false, false];
  const bpm = [0, 0];         // BPM real por plato (del análisis del motor)
  const posn = [0, 0];        // posición (s) por plato, del estado periódico del motor
  let started = false;

  bridge.onLoaded = (m) => {
    if (m.ok) {
      loaded[m.deck] = true;
      if (m.bpm) bpm[m.deck] = m.bpm;
      const lbl = m.deck ? 'B' : 'A';
      say(`Cargado en ${lbl}: <b>${m.name || 'pista'}</b>${m.bpm ? ` · ${Math.round(m.bpm)} BPM` : ''}${(m.key != null && m.key >= 0) ? ` · tono ${m.key}` : ''}. Usa ▶❚❚ para reproducir.`);
    } else {
      say(`No se pudo cargar en el plato ${m.deck ? 'B' : 'A'}: ${m.err || 'error'}`, true);
    }
  };
  bridge.onStatus = (m) => { if (m && m.decks) m.decks.forEach((d, i) => { if (d && typeof d.pos === 'number') posn[i] = d.pos; }); };
  bridge.onError = (msg) => say('Motor de audio: ' + msg, true);

  // Arranca el motor en el primer gesto del usuario (política de autoplay).
  async function ensureStarted() {
    if (started) return true;
    try {
      say('Iniciando el motor de audio…');
      await bridge.start();
      started = true;
      bridge.master(parseFloat($('master').value));
      bridge.xfader(parseFloat($('xfader').value));
      say('Motor listo. Toca <b>Importar Archivos</b> para cargar A y B.');
      return true;
    } catch (e) {
      say('No se pudo iniciar el motor de audio: ' + (e.message || e), true);
      return false;
    }
  }

  // Guarda una pista en la biblioteca local persistente (IndexedDB) para que aparezca
  // en la fuente "Local" del buscador y se recuerde entre sesiones (Fase 1).
  async function saveToLibrary(f) { try { if (LIB.available()) await LIB.putTrack({ name: f.name, bytes: await f.arrayBuffer() }); } catch (e) {} }

  // Importar -> selector -> cargar 1ª pista en A, 2ª en B (y guardarlas en la biblioteca).
  let search = null;
  const fileIn = $('fileIn');
  $('importar').addEventListener('click', async () => { if (await ensureStarted()) fileIn.click(); });
  fileIn.addEventListener('change', async () => {
    const files = Array.prototype.slice.call(fileIn.files || []);
    if (!files.length) return;
    if (!(await ensureStarted())) return;
    if (files[0]) { say('Cargando <b>' + files[0].name + '</b> en A…'); await bridge.load(0, files[0], files[0].name); await saveToLibrary(files[0]); }
    if (files[1]) { await bridge.load(1, files[1], files[1].name); await saveToLibrary(files[1]); }
    fileIn.value = '';
    if (search) await search.refreshLocal();
  });

  function toggle(deck, label) {
    if (!loaded[deck]) { say('Primero carga una pista con <b>Importar Archivos</b> (plato ' + label + ').', true); return; }
    playing[deck] = !playing[deck];
    bridge.play(deck, playing[deck]);
    if (playing[deck]) say('Plato ' + label + ' reproduciendo.');
  }
  $('playA').addEventListener('click', async () => { if (await ensureStarted()) toggle(0, 'A'); });
  $('playB').addEventListener('click', async () => { if (await ensureStarted()) toggle(1, 'B'); });

  // CUE: pausa y vuelve al inicio (comportamiento conservado de la etapa 1).
  function cue(deck) { if (!loaded[deck]) return; playing[deck] = false; bridge.play(deck, false); bridge.seek(deck, 0); }
  $('cueA').addEventListener('click', () => cue(0));
  $('cueB').addEventListener('click', () => cue(1));

  // Crossfader y Master -> motor real.
  $('xfader').addEventListener('input', (e) => { if (started) bridge.xfader(parseFloat(e.target.value)); });
  $('master').addEventListener('input', (e) => { if (started) bridge.master(parseFloat(e.target.value)); });

  // Buscador unificado (Fase 1): barra "Buscar en la biblioteca" -> 4 fuentes -> cargar a A/B.
  search = setupSearch({ bridge, ensureStarted, onStatus: say });

  // Controles de plato (Fase 2): EQ, keylock, SYNC, loop, hotcues, beatjump sobre la imagen.
  setupMixer({
    frame: $('frame'), bridge, ensureStarted, onStatus: say,
    getBpm: (d) => bpm[d] || 0, getPos: (d) => posn[d] || 0,
  });

  // Enganche mínimo para pruebas automatizadas (no afecta la UI).
  window.__audit = {
    bridge, lib: LIB,
    get started() { return started; },
    get loaded() { return loaded.slice(); },
    get playing() { return playing.slice(); },
    get bpm() { return bpm.slice(); },
    get posn() { return posn.slice(); },
    refreshLocal: () => (search ? search.refreshLocal() : Promise.resolve()),
    // Pico del PCM que consume el worklet: se lee Y SE RESETEA (como mixer.html), para
    // que mida el nivel de la ventana reciente y no un máximo histórico monotónico.
    peak() { try { const c = new Int32Array(bridge._buffers.ctrl); const v = (Atomics.load(c, 3) || 0) / 1e6; Atomics.store(c, 3, 0); return v; } catch (e) { return -1; } },
  };
</script>
</body>
</html>
